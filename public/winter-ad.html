<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101619">
  <title>Winter Triptych — Pointspective Ad</title>
  <style>
    :root {
      color-scheme: dark;
      background: #101619;
      --gutter: #101619;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #101619;
    }

    .ad-frame {
      position: relative;
      width: min(100vw, 56.25svh);
      height: min(100svh, 177.7778vw);
      aspect-ratio: 9 / 16;
      overflow: hidden;
      isolation: isolate;
      background: #182126;
    }

    .panel {
      position: absolute;
      inset: 0;
      overflow: hidden;
      opacity: 0;
      will-change: transform, opacity;
      animation: panel-arrive 900ms cubic-bezier(.2,.8,.2,1) var(--delay) forwards;
    }

    .panel img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Comic-triptych edges: the dark frame shows through as diagonal gutters. */
    .panel-worker {
      z-index: 1;
      clip-path: polygon(0 0, 39% 0, 24% 100%, 0 100%);
      --delay: 250ms;
      transform: translateX(-9%);
    }

    .panel-passenger {
      z-index: 2;
      clip-path: polygon(40.2% 0, 73.8% 0, 59% 100%, 25.2% 100%);
      --delay: 1050ms;
      transform: translateY(8%);
    }

    .panel-bus-stop {
      z-index: 1;
      clip-path: polygon(75% 0, 100% 0, 100% 100%, 60.2% 100%);
      --delay: 1850ms;
      transform: translateX(9%);
    }

    @keyframes panel-arrive {
      from {
        opacity: 0;
        transform: translate(var(--from-x, 0), var(--from-y, 0)) scale(.98);
      }
      to {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
    }

    .panel-worker { --from-x: -9%; }
    .panel-passenger { --from-y: 8%; }
    .panel-bus-stop { --from-x: 9%; }

    @media (prefers-reduced-motion: reduce) {
      .panel {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <main class="ad-frame" aria-label="Winter scene triptych">
    <figure class="panel panel-worker">
      <img src="./images/ad-street-worker.jpg" alt="A street worker standing in freezing rain">
    </figure>
    <figure class="panel panel-passenger">
      <img src="./images/ad-passenger.jpg" alt="A bundled passenger riding a cold bus">
    </figure>
    <figure class="panel panel-bus-stop">
      <img src="./images/ad-bus-stop.jpg" alt="A commuter waiting at a snowy bus stop">
    </figure>
  </main>
</body>
</html>
