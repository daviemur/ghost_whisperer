<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pointspective</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; color: #1a1a1a; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; }
.card { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 48px 40px; width: 100%; max-width: 400px; box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
.platform-tag { font-size: 0.72rem; font-weight: 600; letter-spacing: 2px; color: #2563eb; margin-bottom: 6px; text-transform: uppercase; }
h1 { font-size: 2rem; font-weight: 700; letter-spacing: 3px; color: #111; margin-bottom: 6px; }
.tagline { font-size: 0.85rem; color: #888; margin-bottom: 36px; font-style: italic; }
label { display: block; font-size: 0.8rem; font-weight: 600; color: #444; margin-bottom: 6px; letter-spacing: 0.5px; }
input, textarea { width: 100%; padding: 10px 14px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; margin-bottom: 20px; outline: none; color: #111; font-family: inherit; }
textarea { resize: vertical; min-height: 80px; font-size: 0.88rem; }
input:focus, textarea:focus { border-color: #2563eb; }
.code-input { letter-spacing: 0.1em; text-transform: uppercase; }
.code-input::placeholder { text-transform: none; letter-spacing: normal; }
button { width: 100%; padding: 12px; background: #111; color: #fff; border: none; border-radius: 6px; font-size: 0.95rem; font-weight: 600; cursor: pointer; letter-spacing: 1px; text-transform: uppercase; transition: background 0.2s; }
button:hover { background: #333; }
button:disabled { background: #999; cursor: not-allowed; }
#error { color: #dc2626; font-size: 0.82rem; margin-top: 10px; display: none; }
.powered-by { font-size: 0.68rem; color: #ccc; text-align: center; margin-top: 28px; letter-spacing: 1px; }
</style>
</head>
<body>

<div class="card">
  <div class="platform-tag">AI Skills Benchmark</div>
  <h1>POINTSPECTIVE</h1>
  <p class="tagline">Know where you stand.</p>

  <label>Your Name</label>
  <input type="text" id="name" placeholder="Full name" />

  <label>Your Background <span style="font-weight:400;color:#888">(briefly)</span></label>
  <textarea id="background" placeholder="e.g. Marketing manager, software developer, curious person..."></textarea>

  <label>Access Code <span style="font-weight:400;color:#888">(leave blank to begin)</span></label>
  <input type="text" id="code" class="code-input" placeholder="Enter code if you have one" autocomplete="off" />

  <button id="begin-btn" onclick="begin()">BEGIN</button>
  <div id="error"></div>
</div>

<div class="powered-by">POINTSPECTIVE.COM</div>

<script>
async function begin() {
  const name = document.getElementById('name').value.trim();
  const bg   = document.getElementById('background').value.trim();
  const code = document.getElementById('code').value.trim().toUpperCase();
  const err  = document.getElementById('error');
  const btn  = document.getElementById('begin-btn');

  err.style.display = 'none';
  if (!name) { err.textContent = 'Please enter your name.'; err.style.display = 'block'; return; }
  if (!bg)   { err.textContent = 'Please describe your background.'; err.style.display = 'block'; return; }

  btn.disabled = true;
  btn.textContent = 'CHECKING...';

  try {
    const resp = await fetch('/api/validate-code', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ code })
    });
    const data = await resp.json();

    // Store session data for the target page
    sessionStorage.setItem('ps_entry', JSON.stringify({
      name, background: bg, code: code || 'PS-PUBLIC', org: data.org, level: data.level
    }));

    if (data.level === 2) {
      window.location.href = '/level-two.html';
    } else {
      window.location.href = '/level-one.html';
    }
  } catch(e) {
    err.textContent = 'Could not connect. Please try again.';
    err.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'BEGIN';
  }
}

// Allow Enter key
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') begin();
});
</script>
</body>
</html>
